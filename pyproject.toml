[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "license-lens"
version = "0.1.0"
description = "开源许可证合规扫描器：输入依赖清单，输出能否这样发布与需要履行的义务"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["license", "compliance", "open-source", "cli", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
license-lens = "license_lens.cli:main"

[tool.setuptools]
packages = ["license_lens"]
