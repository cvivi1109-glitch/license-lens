name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 单元测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 运行单元测试（零第三方依赖）
        run: python -m unittest discover -s tests -v

      - name: 冒烟测试：核心命令必须可运行
        run: |
          python -m license_lens list
          python -m license_lens check MIT GPL-3.0
          python -m license_lens check GPL-3.0 MIT || test $? -eq 2
          python -m license_lens matrix
          python -m license_lens scan examples/deps.txt || test $? -eq 1
